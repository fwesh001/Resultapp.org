# ResultApp API edge — api.resultapp.org -> FastAPI (127.0.0.1:8000)
#
# Install on the droplet:
#   cp backend/scripts/nginx/api-resultapp.conf /etc/nginx/sites-available/api-resultapp
#   ln -sf /etc/nginx/sites-available/api-resultapp /etc/nginx/sites-enabled/api-resultapp
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.resultapp.org --agree-tos -m support@resultapp.org
#
# NOTE: certbot rewrites this file in place to add the TLS block and redirect.
# Keep the plain-HTTP server block above it so HTTP-01 renewals keep working.

server {
    listen 80;
    listen [::]:80;
    server_name api.resultapp.org;

    # School imports can be large (RosarioSIS roster uploads).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # NDPR s.41(3) evidence: the backend takes the FIRST entry of
        # X-Forwarded-For as the client IP (routers/support.py,
        # routers/report.py). Cloudflare sets that header to the real
        # client IP, and nginx appends $remote_addr (the CF edge IP), so
        # the first entry stays correct. Dropping this header entirely
        # would collapse every recorded IP to 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}